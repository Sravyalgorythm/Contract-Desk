[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-legal-agent"
version = "0.1.0"
description = "A local, evidence-grounded legal contract assistant powered by Ollama."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "python-dotenv>=1.1",
    "requests>=2.32",
    "streamlit>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[tool.setuptools.packages.find]
include = ["legal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
